<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>
    <style>
      .attribution {
        font-size: 14px;
        text-align: center;
        margin-top: 2rem;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
      }
      body {
        height: 100vh;
        background-color: hsl(212, 45%, 89%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      #container {
        background-color: hsl(0, 0%, 100%);
        padding: 0.6rem;
        text-align: center;
        border-radius: 1rem;
      }
      img {
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
      h4 {
        margin-bottom: 1rem;
        color: hsl(218, 44%, 22%);
        font-weight: 700;
      }
      p {
        color: hsl(216, 15%, 48%);
        font-size: 12px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="qr-container">
        <img src="./images/image-qr-code.png" width="200px" alt="QR code" />
      </div>
      <div id="content">
        <h4>
          Improve your front-end <br />
          skills by building projects
        </h4>
        <p>
          Scan the QR code to visit Frontend <br />
          Mentor and take your coding skills to <br />the next level
        </p>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.agiemachiya.me/" target="_blank">Agrippa Machiya</a>.
    </div>
  </body>
</html>
